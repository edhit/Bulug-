 if(g){const idx=hs.findIndex(h=>h.g===g);if(idx>=0){L.more(idx+8);requestAnimationFrame(()=>{const el=list.querySelector('#h'+g);if(el){sc.scrollTop=el.offsetTop-60-(parseFloat(getComputedStyle(sc).paddingTop)||0)+list.offsetTop-list.offsetTop;el.scrollIntoView({block:'start'});sc.scrollTop-=60}})}}
 else sc.scrollTop=0;
}

/* search */
let NORM=null;
function buildIndex(){if(NORM)return;NORM=H.map(h=>({a:normAr(h.a),f:normAr(h.f),e:h.e.toLowerCase()}))}
let sq={q:'',filters:new Set(),inFn:false,ch:0};
const FCH=[['bukhari','Бухари'],['muslim','Муслим'],['muttafaq','Муттафакун алейх'],['abudawud','Абу Дауд'],['tirmidhi','Тирмизи'],['nasai','Насаи'],['ibnmajah','Ибн Маджа'],['ahmad','Ахмад'],['group','Группы'],['sahihs','Ибн Хиббан и др.'],['other','Другие'],['sahih','Сахих'],['hasan','Хасан'],['daif','Слабый'],['ilal','Мурсаль/маукуф']];
function renderSearch(){
 const v=views.search;
 v.innerHTML=navHtml('Поиск')+'<div class="scroll"><div class="big"><h1>Поиск</h1></div>'+
 '<div class="sbar"><label class="sfield">'+I.search+'<input id="sq" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" placeholder="Слово, фраза или № хадиса"><button class="clr" id="sclr" aria-label="Очистить">✕</button></label></div>'+
 '<div class="chips" id="chips">'+'<button class="chip'+(sq.inFn?' on':'')+'" data-fn="1">+ в тахридже</button>'+FCH.map(([k,n])=>'<button class="chip'+(sq.filters.has(k)?' on':'')+'" data-k="'+k+'">'+n+'</button>').join('')+'</div>'+
 '<div class="chips" id="chch"><button class="chip'+(sq.ch?'':' on')+'" data-c="0">Все книги</button>'+CH.map(c=>'<button class="chip'+(sq.ch===c.id?' on':'')+'" data-c="'+c.id+'">'+RU[c.id-1]+'</button>').join('')+'</div>'+
 '<div class="cnt" id="scnt"></div><div class="list" id="slist"></div></div>';
 const sc=bindNav(v),inp=v.querySelector('#sq');inp.value=sq.q;
 let tm;inp.addEventListener('input',()=>{sq.q=inp.value;v.querySelector('#sclr').style.display=inp.value?'grid':'none';clearTimeout(tm);tm=setTimeout(()=>doSearch(sc),220)});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()});
 v.querySelector('#sclr').onclick=e=>{e.preventDefault();inp.value='';sq.q='';v.querySelector('#sclr').style.display='none';doSearch(sc)};
 v.querySelector('#sclr').style.display=sq.q?'grid':'none';
 v.querySelectorAll('#chips .chip').forEach(b=>b.onclick=()=>{if(b.dataset.fn){sq.inFn=!sq.inFn;b.classList.toggle('on',sq.inFn)}else{const k=b.dataset.k;sq.filters.has(k)?sq.filters.delete(k):sq.filters.add(k);b.classList.toggle('on')}doSearch(sc)});
 v.querySelectorAll('#chch .chip').forEach(b=>b.onclick=()=>{sq.ch=+b.dataset.c;v.querySelectorAll('#chch .chip').forEach(x=>x.classList.toggle('on',x===b));doSearch(sc)});
 doSearch(sc);
}
function doSearch(sc){
 const v=views.search,list=v.querySelector('#slist'),cnt=v.querySelector('#scnt');list.innerHTML='';list._marksArr=null;
 const raw=sq.q.trim();
 if(!raw&&!sq.filters.size&&!sq.ch){cnt.textContent='';list.innerHTML='<div class="empty">'+I.search+'<b>Поиск по книге</b>Ищите по-арабски без харакатов, например «الوضوء» или «أبو هريرة». Английский перевод тоже учитывается. Число открывает хадис по номеру.</div>';return}
 if(/^#?\d+$/.test(raw)){const h=H[parseInt(raw.replace('#',''))-1];if(h){cnt.textContent='Хадис № '+h.g;list._marksArr=[null];lazyList(list,[h],card,sc);return}}
 buildIndex();
 const isAr=/[\u0600-\u06FF]/.test(raw);
 const words=(isAr?normAr(raw):raw.toLowerCase()).split(/\s+/).filter(Boolean);
 const res=[];
 for(const h of H){
  if(sq.ch&&h.c!==sq.ch)continue;
  if(sq.filters.size){const tg=analyze(h).tags;let ok=true;for(const k of sq.filters)if(!tg.has(k)&&!(k==='muttafaq'&&tg.has('both'))){ok=false;break}if(!ok)continue}
  if(words.length){const N=NORM[h.i];const hay=isAr?(N.a+(sq.inFn?' '+N.f:'')):N.e;if(!words.every(w=>hay.includes(w)))continue}
  res.push(h)}
 cnt.textContent=res.length?'Найдено: '+plural(res.length,'хадис','хадиса','хадисов'):'';
 if(!res.length){list.innerHTML='<div class="empty">'+I.search+'<b>Ничего не найдено</b>Попробуйте написать слово короче или без приставки «ال», снимите фильтры.</div>';return}
 if(isAr&&words.length)list._marksArr=res.map(h=>{const nm=normMap(h.a),mk=new Uint8Array(h.a.length);for(const w of words){let p=0;while((p=nm.s.indexOf(w,p))>-1){const a=nm.m[p],b=nm.m[p+w.length-1];for(let i=a;i<=b;i++)mk[i]=1;p+=w.length}}return mk});
 let idx=0;const arr=list._marksArr;
 lazyList(list,res,h=>card(h,arr?arr[res.indexOf(h)]:null),sc,20);
}

/* favorites */
let favSeg=store.get('favSeg','fav');
function renderFav(){
 const v=views.fav;
 v.innerHTML=navHtml('Мои хадисы')+'<div class="scroll"><div class="big"><h1>Мои хадисы</h1></div>'+
 '<div class="seg" id="fseg"><button data-s="fav">Избранное</button><button data-s="learned">Выучено</button><button data-s="notes">Заметки</button></div>'+
 '<div class="jump" id="fjump"></div><div class="list" id="flist"></div></div>';
 const sc=bindNav(v);
 const fill=()=>{store.set('favSeg',favSeg);v.querySelectorAll('#fseg button').forEach(b=>b.classList.toggle('on',b.dataset.s===favSeg));
  const list=v.querySelector('#flist');list.innerHTML='';
  const set=favSeg==='fav'?[...FAV]:favSeg==='learned'?[...LEARN]:Object.keys(NOTES).map(Number);
  const hs=set.sort((a,b)=>a-b).map(g=>H[g-1]).filter(Boolean);
  const j=v.querySelector('#fjump');
  j.innerHTML=hs.length&&favSeg!=='notes'?'<button class="chip" id="fcopy">Скопировать все ('+hs.length+')</button>'+(favSeg==='fav'?'<button class="chip" id="fquiz">Повторить случайный</button>':''):'';
  const fc=j.querySelector('#fcopy');if(fc)fc.onclick=async()=>{await copyText(hs.map(h=>hadithCopy(h)).join('\n\n———\n\n'));toast('Скопировано: '+hs.length)};
  const fq=j.querySelector('#fquiz');if(fq)fq.onclick=()=>{const h=hs[Math.floor(Math.random()*hs.length)];openChapter(h.c,h.g)};
  if(!hs.length){list.innerHTML='<div class="empty">'+(favSeg==='fav'?I.star:favSeg==='learned'?I.check:I.note)+'<b>'+(favSeg==='fav'?'Нет избранных':favSeg==='learned'?'Пока ничего не выучено':'Нет заметок')+'</b>'+(favSeg==='fav'?'Нажмите звёздочку под любым хадисом.':favSeg==='learned'?'Отмечайте хадисы галочкой, и прогресс появится в списке глав.':'Добавьте заметку через кнопку «⋯» под хадисом.')+'</div>';return}
  lazyList(list,hs,h=>card(h),sc)};
 v.querySelectorAll('#fseg button').forEach(b=>b.onclick=()=>{favSeg=b.dataset.s;fill()});
 fill();
}

/* settings */
function sw(key,label,sub){return '<label class="row"><div class="main"><div class="t">'+label+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+'</div><span class="sw"><input type="checkbox" data-s="'+key+'"'+(S[key]?' checked':'')+'><i></i></span></label>'}
function renderSet(){
 const v=views.set;
 const legend=[...Object.entries(KEYS).map(([k,x])=>'<div class="row"><div class="lg"><span class="t">'+x.n+'</span><span class="sw2 ar" style="margin:0;font-size:20px"><span class="k k-'+k+'">'+x.ar+'</span></span></div></div>'),
  ...Object.entries(GR).map(([k,x])=>'<div class="row"><div class="lg"><span class="t">'+x.n+'</span><span class="sw2 ar" style="margin:0;font-size:20px"><span class="g g-'+k+'">'+x.ar+'</span></span></div></div>'),
  '<div class="row"><div class="lg"><span class="t">Передатчик (сахаба)</span><span class="ar" style="margin:0;font-size:20px"><span class="nar">أبي هريرة</span></span></div></div>',
  '<div class="row"><div class="lg"><span class="t">Слова хадиса</span><span class="ar" style="margin:0;font-size:20px;color:var(--label)">إنما الأعمال بالنيات</span></div></div>',
  '<div class="row"><div class="lg"><span class="t">Глагол тахриджа</span><span class="ar" style="margin:0;font-size:20px"><span class="vb">أخرجه</span></span></div></div>'].join('');
 v.innerHTML=navHtml('Настройки')+'<div class="scroll"><div class="big"><h1>Настройки</h1></div>'+
 '<div class="sect"><div class="sh">Оформление</div><div class="grp">'+
 '<div class="row"><div class="main"><div class="t">Тема</div></div><div class="seg inrow" id="thm"><button data-v="auto">Авто</button><button data-v="light">Светлая</button><button data-v="dark">Тёмная</button></div></div>'+
 '<div class="row"><div class="main"><div class="t">Шрифт</div></div><div class="seg inrow" id="fnt"><button data-v="amiri">Амири</button><button data-v="sys">Системный</button></div></div>'+
 '<div class="row" style="display:block;padding-top:10px;padding-bottom:6px"><div class="t" style="display:flex;justify-content:space-between">Размер арабского текста<span class="v" id="szv">'+S.size+'</span></div><input class="rng" type="range" min="16" max="40" step="1" id="sz" value="'+S.size+'"><div class="prev">إِنَّمَا اَلْأَعْمَالُ بِالنِّيَّاتِ</div></div>'+
 '</div></div>'+
 '<div class="sect"><div class="sh">Текст</div><div class="grp">'+sw('colors','Цветная разметка','Мухаддисы, оценки и передатчики')+sw('tashkeel','Харакаты')+sw('saw','Показывать ﷺ','Вместо «صلى الله عليه وسلم»')+sw('trOpen','Перевод раскрыт сразу','Английский перевод')+sw('fnOpen','Тахридж раскрыт сразу','Сноски мухаккика')+'</div></div>'+
 '<div class="sect"><div class="sh">Заучивание</div><div class="grp">'+sw('learn','Скрывать источники и оценки','Нажмите на скрытое слово, чтобы проверить себя')+sw('hideMatn','Скрывать текст хадиса','Вспомните хадис по передатчику, затем нажмите')+'</div><div class="sf">Отмечайте выученные хадисы галочкой. Прогресс виден в списке книг.</div></div>'+
 '<div class="sect"><div class="sh">Копирование</div><div class="grp">'+sw('cpSrc','Добавлять источник','Название книги и номер')+sw('cpTr','Добавлять перевод')+sw('cpFn','Добавлять тахридж')+'</div></div>'+
 '<div class="sect"><div class="sh">Легенда цветов</div><div class="grp">'+legend+'</div></div>'+
 '<div class="sect"><div class="sh">Данные</div><div class="grp">'+
 '<button class="row tap ic" id="exp"><span class="ico" style="background:#007AFF">'+I.copy+'</span><div class="main"><div class="t">Скопировать резервную копию</div></div>'+I.chev+'</button>'+
 '<button class="row tap ic" id="imp"><span class="ico" style="background:#5856D6">'+I.bookmark+'</span><div class="main"><div class="t">Восстановить из копии</div></div>'+I.chev+'</button>'+
 '<button class="row tap ic" id="rst"><span class="ico" style="background:#FF3B30">'+I.info+'</span><div class="main"><div class="t" style="color:#FF3B30">Сбросить прогресс</div></div></button>'+
 '</div><div class="sf">Избранное, выученное и заметки хранятся только на этом устройстве. Сохраняйте копию в Заметки, чтобы не потерять.</div></div>'+
 '<div class="sect"><div class="sh">О книге</div><div class="grp"><div class="row"><div class="main"><div class="t">«аль-Арбаун ан-Нававийя» с зиядами Ибн Раджаба</div><div class="s">Имам ан-Навави (ум. 676 г. х.) собрал 42 хадиса; хафиз Ибн Раджаб аль-Ханбали (ум. 795 г. х.) добавил ещё 8, доведя число до '+plural(H.length,'хадиса','хадисов','хадисов')+'. Хадисы 1–42 и их тахридж — по матну ан-Навави. Хадисы 43–50: текст приведён по сводам аль-Бухари, Муслима, ат-Тирмизи и Ибн Маджи, рамка иснада дана в обычной для матна форме. Арабский текст и английский перевод — по данным sunnah.com. Нумерация сквозная и может отличаться от печатных изданий.</div></div></div></div></div>'+
 '</div>';
 bindNav(v);
 v.querySelectorAll('[data-s]').forEach(i=>i.onchange=()=>{S[i.dataset.s]=i.checked;saveS();applyS();dirty()});
 const seg=(id,key)=>{const s=v.querySelector(id);s.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',S[key]===b.dataset.v);b.onclick=()=>{S[key]=b.dataset.v;saveS();applyS();s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}})};
 seg('#thm','theme');seg('#fnt','font');
 const sz=v.querySelector('#sz');sz.oninput=()=>{S.size=+sz.value;v.querySelector('#szv').textContent=S.size;applyS();saveS()};
 v.querySelector('#exp').onclick=async()=>{const d=JSON.stringify({v:1,fav:[...FAV],learned:[...LEARN],notes:NOTES,settings:S});await copyText(d);toast('Копия в буфере обмена')};
 v.querySelector('#imp').onclick=()=>{const x=prompt('Вставьте текст резервной копии');if(!x)return;try{const d=JSON.parse(x);FAV=new Set(d.fav||[]);LEARN=new Set(d.learned||[]);NOTES=d.notes||{};if(d.settings)Object.assign(S,d.settings);saveFav();saveLearn();saveNotes();saveS();applyS();dirty();renderSet();toast('Данные восстановлены')}catch(e){alert('Не удалось прочитать копию. Проверьте, что текст скопирован целиком.')}};
 v.querySelector('#rst').onclick=()=>actionSheet('Избранное, выученное и заметки будут удалены',[{t:'Сбросить прогресс',red:1,f:()=>{FAV.clear();LEARN.clear();NOTES={};LAST=null;saveFav();saveLearn();saveNotes();store.set('last',null);dirty();toast('Прогресс сброшен')}}]);
}
function dirty(){H.forEach(h=>{});stale={lib:1,search:1,fav:1,ch:1}}
let stale={};

/* tabs */
const TABS=[['lib','Книга',I.book],['search','Поиск',I.search],['fav','Мои',I.starF],['set','Настройки',I.gear]];
['lib','ch','search','fav','set'].forEach(k=>views[k]=mkView(k));
$('#tabbar').innerHTML=TABS.map(([k,n,ic])=>'<button data-tab="'+k+'">'+ic+'<span>'+n+'</span></button>').join('');
$('#tabbar').querySelectorAll('button').forEach(b=>b.onclick=()=>{
 if(b.dataset.tab===tab){ // tap active tab: scroll top / pop
  if(tab==='lib'&&inChapter){views.ch.classList.remove('on');inChapter=false;renderLib();views.lib.classList.add('on')}
  else{const v=tab==='lib'?views.lib:views[tab];const sc=v.querySelector('.scroll');sc&&sc.scrollTo({top:0,behavior:'smooth'})}
  return}
 switchTab(b.dataset.tab)});
const rendered={};
function switchTab(t,silent){
 tab=t;store.set('tab',t);
 Object.values(views).forEach(v=>v.classList.remove('on'));
 $('#tabbar').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
 if(t==='lib'){if(inChapter&&!silent){if(stale.ch){stale.ch=0;fillChapter(views.ch.querySelector('.scroll'))}views.ch.classList.add('on')}else{if(!silent){renderLib();views.lib.classList.add('on')}}return}
 if(t==='search'){if(!rendered.search||stale.search){rendered.search=1;stale.search=0;renderSearch()}}
 if(t==='fav')renderFav();
 if(t==='set'&&!rendered.set){rendered.set=1;renderSet()}
 views[t].classList.add('on');
}
applyS();
renderLib();
switchTab(tab==='ch'?'lib':tab);
